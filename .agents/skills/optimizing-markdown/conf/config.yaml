# LLM 非敏感配置
# 密钥通过 AUTODOC_LLM_* 环境变量提供，不得写入本文件

# LLM 提供者类型: openai, anthropic, azure_openai, google_vertexai, litellm
provider: litellm

# 默认模型配置
model:
  # OpenAI
  openai: gpt-4o
  # Anthropic
  anthropic: claude-opus-4-6
  # Azure OpenAI
  azure_openai: gpt-4o
  # Google Vertex AI
  google_vertexai: gemini-pro
  # LiteLLM 代理
  litellm: deepseek-flash

# OpenAI 配置
openai: {}

# Anthropic 配置
anthropic: {}

# Azure OpenAI 配置
azure_openai:
  azure_endpoint: ""  # 例如: https://your-resource.openai.azure.com/
  api_version: "2024-02-01"

# Google Vertex AI 配置
google_vertexai:
  project_id: ""  # GCP 项目 ID
  location: "us-central1"

# LiteLLM 代理配置
litellm:
  api_base: "http://localhost:4000"  # LiteLLM 代理服务器地址

# 生成参数
generation:
  max_tokens: 131072
  temperature: 0.4
  top_p: 0.7

# 分块阈值比例，均基于 generation.max_tokens 计算
chunking:
  body_ratio: 0.45
  summary_ratio: 0.10
  intro_summary_input_ratio: 0.15
  single_summary_input_multiplier: 2

# 各阶段生成文本的长度约束
optimization:
  single_summary_length: 400
  chunk_summary_length: 300
  intro_length: 100
  summary_length: 150
