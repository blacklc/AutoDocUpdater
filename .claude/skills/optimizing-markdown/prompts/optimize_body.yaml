# 正文优化 Prompt
# 仅优化正文,不生成前言和总结

template: |
  # Instruction

   你现在是一个有着资深编程经历的工程师.
   ```目前需要你对已有的一个markdown格式文件的内容进行优化, 使文档内容能够更好的在互联网中的各大技术博客平台上进行展示.```

  # 优化要求

  【重要 - 必须全部执行】必须执行以下优化：
  1. 删除多余空白内容（词语间空格、过多空行）
  2. 将 tips: 转换为 > Tips: 引用格式
  3. 将注意: 转换为 > 注意: 引用格式
  4. 【重点】提升文章中所有标题的级别：## → #, ### → ##, #### → ###(等以此类推),不得保留任何原级别的标题
  5. 在大章节之间添加 --- 分隔符
  6. 为代码段添加高亮显示
  7. 高亮重点语句

  【重要】请只优化正文内容,不要生成"# 前言"和"# 总结"章节。

  ---
  # 文章内容：

  {article_content}

  ---
  # 优化风格

   ## 1.删除多余空白内容.
   原md文档中可能会包含有多处多余的空白内容,脚本应将其删除.以下给出几种多余空白的修改示例以供参考.
   - 词语中存在空白,例如:
   ```md
   # etc d mv cc
   ```
   应该修改为:
   ```md
   # etcd mvcc
   ```

   - 存在过多的空白行, 例如:
   ```md
   prompt中往往都会描述在正常情况下, llm应该如何处理需求.



   而为了避免llm在处理问题时出现一些意外错误或结果, 应该也针对非常规情况的处理方式进行详细的阐述.
   ```
   应修改为:
   ```md
   prompt中往往都会描述在正常情况下, llm应该如何处理需求.

   而为了避免llm在处理问题时出现一些意外错误或结果, 应该也针对非常规情况的处理方式进行详细的阐述.
   ```

   ## 2.将带有```tips```的内容段落转换为指定格式
   例如:
   ```md
   tips:

      类似于装饰器设计模式的应用方式

   KVServer支持注册多个拦截器,KVServer中的handler 会将多个拦截器串联成一个执行。
   ```
   应修改为:
   ```md
   > Tips: 类似于装饰器设计模式的应用方式.KVServer支持注册多个拦截器,KVServer中的handler 会将多个拦截器串联成一个执行。
   ```

   ## 3.将带有```注意```的内容段落转换为指定格式
   例如:
   ```md
   注意:

      类似于装饰器设计模式的应用方式

   KVServer支持注册多个拦截器,KVServer中的handler 会将多个拦截器串联成一个执行。
   ```
   应修改为:
   ```md
   > 注意: 类似于装饰器设计模式的应用方式.KVServer支持注册多个拦截器,KVServer中的handler 会将多个拦截器串联成一个执行。
   ```

   ## 4.【重点】更改文章段落标题的级别
   - 规则：## → #, ### → ##, #### → ###(等以此类推)
   - 示例1:
   ```md
   ## 1.使用场景
   ```
   应修改为
   ```md
   # 1.使用场景
   ```

   - 示例2:
   ```md
   ### 2.1 Pod管理
   ```
   应修改为
   ```md
   ## 2.1 Pod管理
   ```

   ## 5.为每个大章节之间添加分隔符
   例如:
   ```md
   # 章节1
      ....
   # 章节2
      .....
   ```
   应修改为:
   ```md
   # 章节1
      ....
   ---
   # 章节2
      .....
   ---
   ```

   ## 6.为原文中的代码段添加代码高亮显示
   若发现原文中从代码段相关的内容, 此时应该为这些代码段添加高亮显示.```注意: 如果是未知编程语言类型或是markdown不支持的编程语言类型,默认使用python格式来进行高亮表示.```
   - 示例1:
   ```java
   @Library('zhumuLib@master') // 引入Shared Library
   import com.zhumu.git.Git; // 引入Shared Library中的封装类

   node('internal-build') {
      stage('Get code by Gitlab') {
         try {
               // 按需使用封装类
               def gitObject = new Git(this,gitlabCredentialsId);
               gitObject.git_url = gitLabUrl;

               gitObject.setGitExtensions([ $class: 'CleanBeforeCheckout' ]);

               gitObject.pull(gitBranch);

               log.printInfo('Download Code successful.');
         }
         catch(err) {
               log.printInfo('Download Code failed.You can find errors in the jenkins ouput.');
               error(err.message);
         }
      }
   }
   ```

   - 示例2:
   ```python
   def event_handler(data):
      """
      从调用ansible开始,ansible进程每有一行屏幕打印,就会产生一个event
      不同阶段的event都有不同的内部名称,例如playbook_on_stats
      """
      if data['event'] == 'playbook_on_stats': # 获取特定事件中的数据
         print('抓取事件数据')
         print("{}: {}".format('event_data', data['event_data']))

         # 获取执行失败的机器
         unreachable_hosts = set(data['event_data']['dark'].keys())
         failed_hosts = set(data['event_data']['failures'].keys())
         problem_hosts = list(unreachable_hosts | failed_hosts)
         print(f"执行失败的host:{problem_hosts}")

         return True  # 只保存特定事件数据
      elif data['event'] == 'runner_on_ok' and data['event_data']['task'] == 'test task':
         print("{}: {}".format('命令输出', data['event_data']['res']['stdout']))
         return True  # 只保存特定事件数据
      else:
         print('\n产生事件')
         for k, v in data.items():
               print("{}: {}".format(k, v))
         return False  # 不保存其他事件数据
   ```

   ## 7.为文章内容中的重点语句进行高亮标识(使用markdown中的``符号进行标识)
   这需要你根据全文以及当前章节的主旨来判断应该为哪些语句进行高亮标识.以下给出几种示例以供参考.

   - 示例1:
   以下段落的中心主旨是“笔者为读者提供一种在aws lambda中使用面向对象设计的实现思路”.因此高亮标识的部分应为如下所示:
   ```md
   而经过笔者实践,我们也可以使用面向对象设计的思路来编写Lambda;即`对主要业务逻辑进行抽象,并且封装为功能类,最终在lambda_handler方法(函数)来创建这些类的实例对象并调用其相关的实例方法实现业务逻辑`即可。使用面向对象设计来编写lambda_handler方法(函数),可以使一些底层功能逻辑复用起来更加方便(结合Lambda Layer功能),同时还能使Lambda工程有着更好的耦合度和可读性。
   ```

   - 示例2:
   以下段落的中心主旨是“笔者想向读者表达出自己对于ansible runner的最佳应用场景的理解,以及意图告知读者是否适合、应该继续阅读本篇文章的参考”.因此高亮标识的部分应为如下所示:
   ```md
   这个问题本质上就是一个与Ansible命令行交互的问题,而Ansible Runner就可以帮助我们很好的解决这个问题。Ansible Runner会对Ansible的输出结果进行采集和分析,并将其中的数据保存在编程语言中的基础类型变量中。`Ansible Runner能够帮助我们更好通过编码的方式来与Ansible进行交互`。同时,Ansible Runner还将Ansible的相关调用封装成了标准的API供使用者调用;支持使用者自定义状态处理器或事件处理器来对Ansible执行过程中的各类事件或状态进行分析和处理。
   因此,笔者在最开始就提到过,如果你需要将Ansible与相关自研平台或服务结合的需求时,则推荐使用Ansible Runner来封装Ansible相关功能。这样能够减轻很多代码开发的工作量,并且能够提高的平台/服务与Ansible交互的稳定性。当然,`如果你只是有着“使用脚本来调用Ansible”的需求的话,那么就无需继续阅读本文的后续内容了`。
   ```

   - 示例3:
   以下段落的中心主旨是“笔者想从面向对象设计的方向来解释为何存在ReplicaSet这个k8s对象”.因此高亮标识的部分应为如下所示:
   ```md
   > Tips: 笔者认为,之所以Deployment对象选择使用ReplicaSet对象来管理Pod对象,而不是自身亲自管理Pod对象;原因就在于通过ReplicaSet对象管理可以实现通过一个Deployment对象来管理应用程序多个版本的更新和回退。即`抽象出ReplicaSet对象这个概念,可以将Deployment对象与Pod对象进行解耦,使得Deployment对象可以更加关注于对应用程序版本更新/回退的管控,而弹性伸缩的细节就可以让ReplicaSet对象来协助管理`。如果Deployment对象只需要提供Pod弹性伸缩的功能,则本质上是不需要ReplicaSet对象的。经过这样对象关系抽象后,在Kubernetes中就可以使用Deployment对象来表示实际项目中的应用服务/程序的概念了。
   ```

   ## 8.为文章内容增加配图
   配图应该嵌入到相关章节内容中,不要占用独立章节.```如果原文中不存在任何图片, 则应该优先尝试在互联网上寻找合适的成品图片链接(使用 ![alt](url) 格式); 若无法找到合适的成品图片, 则自动生成 ASCII 图形类型的配图```.使用 ASCII 字符（如 ┌─┐ │ └─┘ ═ ║ ┬ ┤ ├ ┼）绘制图形.配图应紧跟在相关段落的后面.例如:
    ```md
    ## 1.1 架构图

    etcd 采用分层架构设计,主要包含以下组件:

    ```
    ┌─────────────────────────────────────────────────────────────┐
    │                      MVCC 模块                              │
    ├────────────────────────┬────────────────────────────────────┤
    │      treeIndex         │            Backend                 │
    └────────────────────────┴────────────────────────────────────┘
    ```

    ## 2.1 流程说明

    读取数据的流程如下:

    ```
    ┌─────────────────┐
    │  1. 发送请求    │
    └────────┬────────┘
             ▼
    ┌─────────────────┐
    │  2. 返回数据    │
    └─────────────────┘
    ```
    ```
    如果原文中已经包含了使用base64编码的图片, 则请保证这些图片不变,不要自行删除这些图片.

   ## 9. 核查文章中各级标题格式
   文章中的各个级别的标题格式必须符合以下格式: ```<标题序号> <标题名>```.
   应该在其他所有优化项结束后检查该项.
   如果原文中的自带标题不符合格式: ```<标题序号> <标题名>```, 则应该调整为要求的格式.

  ---
  # 输出要求

  ## 基本要求

  1. 直接返回优化后的完整 Markdown 内容
  2. 不要包含任何解释、说明或元数据
  3. 保持 Markdown 格式不变
  4. 确保文章结构清晰、格式规范
  5. 所有优化操作的结果都应体现在返回的内容中
  6. 尽量保留原文内容,不能够过分压缩内容
  7. 不要生成"# 前言"和"# 总结"章节

  ## 输出结构（必须严格遵守）

  1. 开始是正文章节（所有 "##" 变 "#","###" 变 "##" 等等以此类推）
  2. 大章节之间添加 "---" 分隔符

  ---
  请直接返回优化后的正文内容：
