   5. 更改文章段落标题的级别.需要将原文中各章节的标题显示提升一个级别.以下给出几种示例以供参考.
   - 示例1:
   ```md
   ## 1.使用场景
   ```
   应修改为
   ```md
   # 1.使用场景
   ```

   - 示例2:
   ```md
   ### 2.1 Pod管理
   ```
   应修改为
   ```md
   ## 2.1 Pod管理
   ```

   6. 为每个大章节之间添加分隔符.例如:
   ```md
   # 前言
      ....
   # 1.使用场景
      .....
   # 2.实现原理
      ....
   ```
   应修改为:
   ```md
   # 前言
      ....
   ---
   # 1.使用场景
      .....
   ---
   # 2.实现原理
      ....
   ---
   ```

   7. 为文章添加目录章节.需要在文章中的前言章节与第一章节之间添加一个目录章节.添加的内容固定为: ```@[toc](目录)```.例如:
   ```md
   # 前言
      ....
   ---

   @[toc](目录)

   ---

   # 1.使用场景
      .....
   ---

   ```

   8. 为原文中的代码段添加代码高亮显示.若发现原文中从代码段相关的内容, 此时应该为这些代码段添加高亮显示.```注意: 如果是未知编程语言类型或是markdown不支持的编程语言类型,默认使用python格式来进行高亮表示.```以下给出几种示例以供参考.

   - 示例1:
   ```java
   @Library('zhumuLib@master') // 引入Shared Library
   import com.zhumu.git.Git; // 引入Shared Library中的封装类

   node('internal-build') {
      stage('Get code by Gitlab') {
         try {
               // 按需使用封装类
               def gitObject = new Git(this,gitlabCredentialsId);
               gitObject.git_url = gitLabUrl;

               gitObject.setGitExtensions([ $class: 'CleanBeforeCheckout' ]);

               gitObject.pull(gitBranch);

               log.printInfo('Download Code successful.');
         }
         catch(err) {
               log.printInfo('Download Code failed.You can find errors in the jenkins ouput.');
               error(err.message);
         }
      }
   }
   ```

   - 示例2:
   ```python
   def event_handler(data):
      """
      从调用ansible开始,ansible进程每有一行屏幕打印,就会产生一个event
      不同阶段的event都有不同的内部名称,例如playbook_on_stats
      """
      if data['event'] == 'playbook_on_stats': # 获取特定事件中的数据
         print('抓取事件数据')
         print("{}: {}".format('event_data', data['event_data']))

         # 获取执行失败的机器
         unreachable_hosts = set(data['event_data']['dark'].keys())
         failed_hosts = set(data['event_data']['failures'].keys())
         problem_hosts = list(unreachable_hosts | failed_hosts)
         print(f"执行失败的host:{problem_hosts}")

         return True  # 只保存特定事件数据
      elif data['event'] == 'runner_on_ok' and data['event_data']['task'] == 'test task':
         print("{}: {}".format('命令输出', data['event_data']['res']['stdout']))
         return True  # 只保存特定事件数据
      else:
         print('\n产生事件')
         for k, v in data.items():
               print("{}: {}".format(k, v))
         return False  # 不保存其他事件数据
   ```

   9. 为文章增加```总结```章节.如果原文章中结尾部分没有总结章节,则应根据文章内容为其添加一个适当的总结描述段落.以下给出几种示例以供参考.

   - 示例1:
   ```md
   # 总结
   在Ansible的官方文档中写到过: “如果仅是需要通过脚本方式或自动化方式去调用Ansible,则推荐使用Ansible Runner来实现这一需求”。这也就代表着Ansible Runner这个项目是获得了Ansible的官方认可。笔者也经过亲自实战体会了Ansible Runner的优势。使用Ansible Runner调用Ansible,能够让我们更加容易的使用代码和Ansible进行交互,而且还无需担心Ansible版本升级后带来的代码反向依赖问题。Ansible Runner帮助我们将自研项目与Ansible之间实现了很好的解耦。Ansible Runner提供的远程任务执行功能让我们可以以更加灵活的方式去调度Ansible。Ansible Runner本身的学习成本也不是很高,项目中的大部分概念都与Ansible相同,其提供的API也简单易懂,非常容易上手。希望Ansible Runner能够帮助大家更好的将Ansible功能融入到自研服务/平台中。
   ```

   - 示例2:
   ```md
   # 总结
   笔者想通过本文中所介绍的Lambda相关概念以及一些经过笔者实践过的设计经验来告诉大家,无服务化(Serverless)实现起来并没有我们想象中的那么困难了。无服务化(Serverless)可以使我们更加关注于业务逻辑的实现,这一点在实际工作中的体现就是：
   1. 与公司的成本控制和业务发展结合度高
   在无服务化(Serverless)的实践中,更多的人力可以用于去实现业务逻辑,而不再像微服务化时需要有专业的团队专注于设计和实现底层框架。这大大能够节省公司的人力成本,而且使得研发团队能更够专注于业务上的功能开发。
   2. 减少开发成本
   使用无服务化(Serverless)后,开发人员不用再考虑底层框架的相关实现。这一点笔者深有体会,平常在实现新工程时,我们需要先将底层框架实现好,然后在其上实现业务逻辑。即使能够通过拷贝原有工程的底层框架部分,但拷贝后的细节配置更改依旧会消耗时间和精力。但这些问题在无服务化(Serverless)中就不复存在了,开发人员从一开始就可以直接针对业务需求进行设计和研发,无需再花费时间去搭建,对接底层框架。

   当然,不是所有的场景都适合无服务化(Serverless)。推行无服务化(Serverless)一个是需要合适的业务场景,一个是需要整个研发团队有着不错的接受度和设计理念。但这不影响我们去学习这一概念,通过学习新的概念和其原理,也能够帮助我们在设计其他事物中起到参考和拓展思路的作用。
   ```

   - 示例3:
   ```md
   # 总结
   细心的读者应该已经发现了,笔者是比较倾向于使用脚本式风格来编写Pipeline的。这种风格下的Pipeline有着更为灵活的特性,能够实现、支持更多的需求和场景。
   但这种风格的Pipeline的可读性并不是太友好,需要有一定编程基础去阅读。因此笔者在这里给大家一个重要的建议：`了解和学习Groovy的基础知识`。其实在声明式的Pipeline中,也可以通过使用script{}来嵌入Groovy脚本的。如果不需要使用Pipeline去完成一些很复杂的需求,则只学需要学习Groovy的基础知识即可。反之,可能就需要学习Groovy的一些进阶、高级用法了。这些高级用法可能会帮助你去更好的编写Shared Library、使用Jenkins插件以及调用Jenkins核心库方法等。
   其次,Jenkins的一大核心优势就在于其有着丰富的插件资源。这些插件给给予了Jenkins更多的可能性。一般,大多数人都是通过Jenkins的Web页面来添加和配置插件;而在Pipeline中使用和配置插件是通过调用其相应的方法(函数)来实现的。在之前的章节中也提到过,Jenkins的插件实际上也是使用Groovy来编写的。因此就可以通过阅读和查看相应插件的Doc或源码来学习如何通过编码形式来调用该插件了。Jenkins官方提供了一个包含当前版本支持的所有[插件文档索引](https://www.jenkins.io/doc/pipeline/steps/),`笔者强烈建议大家通过这个索引去查找和学习相关插件的使用方法`。
   最后,希望本文中所介绍的这些思路能够帮助大家更好的实现Pipeline。
   ```

   10. 为文章内容增加配图.配图应该嵌入到相关章节内容中,不要占用独立章节.```如果原文中不存在任何图片, 则应该优先尝试在互联网上寻找合适的成品图片链接(使用 ![alt](url) 格式); 若无法找到合适的成品图片, 则自动生成 ASCII 图形类型的配图```.使用 ASCII 字符（如 ┌─┐ │ └─┘ ═ ║ ┬ ┤ ├ ┼）绘制图形.配图应紧跟在相关段落的后面.例如:
